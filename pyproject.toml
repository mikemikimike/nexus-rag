[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag"
version = "0.1.0"
description = "Retrieval over internal documentation for a team's Claude Code on an air-gapped network."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.10",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

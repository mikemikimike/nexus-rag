[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag"
version = "0.1.0"
description = "Retrieval over internal documentation for a team's Claude Code on an air-gapped network."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.10",
    "llama-index-core>=0.12",  # SentenceSplitter, used by the chunker
    "nltk",  # its sentence boundary detection (imported directly by the chunker)
    "beautifulsoup4",  # HTML parsing for extraction
    "markdownify",  # HTML to Markdown for extraction
    "mcp>=2.2",  # the MCP server adapter (MCPServer, streamable HTTP, stdio)
    "uvicorn",  # serves it over HTTP
    "httpx2",  # the MCP client's HTTP layer, which the acceptance suite drives the server with
    "anyio",  # runs that client (imported directly by the MCP server and the acceptance suite)
    "tree-sitter>=0.25",  # parser runtime for syntax-aware code Passages
    "tree-sitter-python>=0.25",  # Python grammar
    "tree-sitter-c>=0.24",  # C grammar
    "liteparse",  # PDF and Office text extraction; provides the `lit` command
]

[project.scripts]
local-rag = "local_rag.cli:run"
local-rag-mcp = "local_rag.mcp_server:run"

[dependency-groups]
dev = [
    "pytest",
    "pyyaml",  # reads the compose file in tests
    "ruff==0.16.10",  # lint and format, as CI runs them
    "mypy==2.4.0",  # typecheck, as CI runs it
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]  # the tests import their shared helpers by module name

[tool.ruff.lint]
# Errors and likely bugs (pyflakes, pycodestyle's runtime errors, bugbear, pyupgrade), and
# sorted imports. Layout is ruff format's.
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]
ignore = [
    "E731",  # a lambda bound to a name, used for small test stand-ins
    "E741",  # `l` as a loop variable
]

[tool.mypy]
python_version = "3.12"
mypy_path = "tests"  # the tests import their shared helpers by module name

[[tool.mypy.overrides]]
module = ["nltk.*", "yaml"]
ignore_missing_imports = true  # neither ships type hints

name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      # The pinned packages the Installer ships (x86_64 Linux, Python 3.12), then the code itself.
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e . pytest pyyaml
      - run: pytest -q -rs
